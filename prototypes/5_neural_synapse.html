<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Neural Synapse Quantum Core</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    @keyframes synapse-pulse { 0%, 100% { opacity: 0.6; transform: scale(1); filter: drop-shadow(0 0 25px #6366f1); } 50% { opacity: 1; transform: scale(1.1); filter: drop-shadow(0 0 50px #a855f7); } }
    @keyframes lightning-flash { 0%, 100% { opacity: 0.3; } 20%, 60% { opacity: 1; filter: drop-shadow(0 0 12px #38bdf8); } 40%, 80% { opacity: 0.5; } }
    .synapse-glow { animation: synapse-pulse 2.5s ease-in-out infinite; }
    .lightning-spark { animation: lightning-flash 1.2s infinite ease-in-out; }
  </style>
</head>
<body class="bg-[#060714] text-slate-100 min-h-screen flex items-center justify-center p-6 relative overflow-hidden selection:bg-indigo-500 selection:text-white">
  
  <!-- Neural Electric Ambient Glow -->
  <div class="absolute w-[800px] h-[800px] rounded-full bg-indigo-600/20 blur-[180px] pointer-events-none"></div>
  <div class="absolute w-[500px] h-[500px] rounded-full bg-amber-500/10 blur-[150px] pointer-events-none -bottom-20 -left-20"></div>

  <!-- Synapse Container -->
  <div class="relative z-10 w-full max-w-2xl rounded-3xl bg-slate-950/90 border border-indigo-500/40 p-8 md:p-12 shadow-[0_0_90px_rgba(99,102,241,0.3)] flex flex-col items-center text-center gap-8 backdrop-blur-2xl">
    
    <!-- Top Telemetry Header -->
    <div class="flex items-center justify-between w-full border-b border-indigo-500/20 pb-4 text-xs font-mono">
      <div class="flex items-center gap-2 text-indigo-400">
        <span class="w-2.5 h-2.5 rounded-full bg-indigo-400 animate-ping"></span>
        <span class="font-bold tracking-widest uppercase">BIO-SYNAPSE NEURAL MATRIX</span>
      </div>
      <div class="text-slate-400">
        SYNAPSES: <span class="text-indigo-300 font-bold">100M+</span> • CHARGE: <span class="text-amber-400 font-bold">98.2%</span>
      </div>
    </div>

    <!-- Central Bio-Electric Synaptic Core -->
    <div class="relative flex items-center justify-center w-64 h-64 my-1">
      
      <!-- Electric Arc Lightning SVG -->
      <svg class="absolute inset-0 w-full h-full lightning-spark pointer-events-none" viewBox="0 0 200 200">
        <!-- Dendrite Lightning Lines -->
        <path d="M100,100 L60,40 L40,25" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6, 3" />
        <path d="M100,100 L140,40 L165,30" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="6, 3" />
        <path d="M100,100 L160,130 L180,150" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6, 3" />
        <path d="M100,100 L40,140 L20,165" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="6, 3" />
        <path d="M100,100 L100,175" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6, 3" />
      </svg>

      <!-- 5 Synaptic Agent Nodes Around Perimeter -->
      <div class="absolute -top-1 left-8 px-2.5 py-0.5 rounded-md bg-sky-500/20 border border-sky-400 text-[10px] font-mono text-sky-300 font-bold">
        👁️ VISION
      </div>
      <div class="absolute -top-1 right-6 px-2.5 py-0.5 rounded-md bg-purple-500/20 border border-purple-400 text-[10px] font-mono text-purple-300 font-bold">
        📊 STATE
      </div>
      <div class="absolute bottom-4 -right-2 px-2.5 py-0.5 rounded-md bg-amber-500/20 border border-amber-400 text-[10px] font-mono text-amber-300 font-bold">
        🧠 MEMORY
      </div>
      <div class="absolute bottom-4 -left-2 px-2.5 py-0.5 rounded-md bg-emerald-500/20 border border-emerald-400 text-[10px] font-mono text-emerald-300 font-bold">
        ⚡ GOVERNOR
      </div>
      <div class="absolute -bottom-4 left-1/2 -translate-x-1/2 px-2.5 py-0.5 rounded-md bg-rose-500/20 border border-rose-400 text-[10px] font-mono text-rose-300 font-bold">
        💬 LLM AGENT
      </div>

      <!-- Center Pulsating Synapse Orb -->
      <div class="relative w-28 h-28 rounded-full bg-gradient-to-tr from-indigo-600 via-purple-500 to-amber-400 shadow-[0_0_60px_#6366f1] flex items-center justify-center synapse-glow">
        <div class="w-16 h-16 rounded-full bg-slate-950/80 border border-white/40 flex items-center justify-center">
          <span class="text-2xl">🧠</span>
        </div>
      </div>
    </div>

    <!-- Title & Description -->
    <div class="flex flex-col gap-2">
      <h1 class="text-3xl md:text-4xl font-black tracking-tight bg-gradient-to-r from-white via-indigo-200 to-amber-300 bg-clip-text text-transparent">
        NEURAL SYNAPSE QUANTUM MATRIX
      </h1>
      <p class="text-sm text-slate-300 max-w-lg font-medium">
        Bio-electric neural network synchronizing 5 autonomous cognitive agents in real-time.
      </p>
    </div>

    <!-- Action Button -->
    <div class="flex flex-col items-center gap-3 w-full max-w-md">
      <button class="w-full py-4 rounded-2xl text-base font-black text-white bg-gradient-to-r from-indigo-600 via-purple-600 to-amber-500 hover:from-indigo-500 hover:to-amber-400 shadow-[0_0_40px_rgba(99,102,241,0.6)] transition-all duration-300 hover:scale-[1.02] flex items-center justify-center gap-2">
        <span>⚡ FIRE NEURAL SYNAPSES</span>
      </button>
      <span class="text-xs font-mono text-slate-400">PRESS <kbd class="px-1.5 py-0.5 rounded bg-slate-800 border border-indigo-500/30 text-indigo-300">SPACE</kbd> TO IGNITE BIO-ELECTRIC CORE</span>
    </div>

  </div>
</body>
</html>
