<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apple Vision Pro Spatial Fluid Glass</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    @keyframes mercury-morph {
      0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; transform: scale(1) rotate(0deg); }
      50% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; transform: scale(1.06) rotate(180deg); }
    }
    .mercury-blob { animation: mercury-morph 8s ease-in-out infinite; }
  </style>
</head>
<body class="bg-[#070b14] text-slate-100 min-h-screen flex items-center justify-center p-6 relative overflow-hidden selection:bg-teal-400 selection:text-black">
  
  <!-- Aurora Borealis Ambient Lighting -->
  <div class="absolute w-[900px] h-[900px] rounded-full bg-teal-500/15 blur-[200px] pointer-events-none -top-40 -left-40"></div>
  <div class="absolute w-[700px] h-[700px] rounded-full bg-purple-500/15 blur-[180px] pointer-events-none -bottom-40 -right-40"></div>

  <!-- Spatial Glass Container -->
  <div class="relative z-10 w-full max-w-2xl rounded-[36px] bg-slate-900/60 border border-white/[0.18] p-8 md:p-12 shadow-[0_30px_100px_rgba(0,0,0,0.8),inset_0_1px_1px_rgba(255,255,255,0.4)] flex flex-col items-center text-center gap-8 backdrop-blur-3xl">
    
    <!-- Top Spatial Status Capsules -->
    <div class="flex items-center justify-between w-full border-b border-white/[0.08] pb-4 text-xs font-medium">
      <div class="flex items-center gap-2 px-3 py-1 rounded-full bg-white/[0.06] border border-white/[0.1] text-teal-300">
        <span class="w-2 h-2 rounded-full bg-teal-400 animate-pulse"></span>
        <span class="font-semibold tracking-wide">SPATIAL COMPUTING // AFFECT OS</span>
      </div>
      <div class="text-slate-400 text-[11px] font-mono">
        COHERENCE: <span class="text-white font-bold">99.2%</span> • SENSORS: <span class="text-teal-300 font-bold">READY</span>
      </div>
    </div>

    <!-- Central Liquid Mercury Sphere with Iridescent Specular Sheen -->
    <div class="relative flex items-center justify-center w-64 h-64 my-1">
      
      <!-- Ambient Fluid Aura -->
      <div class="absolute inset-4 rounded-full bg-gradient-to-tr from-teal-400/30 to-purple-500/30 blur-2xl pointer-events-none"></div>

      <!-- Concentric Frosted Glass Orbit Ring -->
      <div class="absolute inset-2 rounded-full border border-white/[0.15] pointer-events-none"></div>
      <div class="absolute inset-8 rounded-full border border-dashed border-teal-400/30 animate-spin [animation-duration:40s] pointer-events-none"></div>

      <!-- Morphing Liquid Mercury Core -->
      <div class="relative w-32 h-32 mercury-blob bg-gradient-to-tr from-slate-300 via-teal-100 to-purple-200 shadow-[0_0_70px_rgba(45,212,191,0.5),inset_0_0_20px_rgba(255,255,255,0.9)] flex items-center justify-center">
        <div class="w-16 h-16 rounded-full bg-white/60 backdrop-blur-md shadow-[inset_0_0_15px_rgba(0,0,0,0.1)] flex items-center justify-center">
          <span class="text-2xl">🫧</span>
        </div>
      </div>
    </div>

    <!-- Title & Description -->
    <div class="flex flex-col gap-2.5">
      <h1 class="text-3xl md:text-5xl font-black tracking-tight bg-gradient-to-r from-white via-teal-100 to-purple-200 bg-clip-text text-transparent">
        SPATIAL EMOTION MIRROR
      </h1>
      <p class="text-sm md:text-base text-slate-300 max-w-lg font-normal leading-relaxed">
        Next-generation affective intelligence with visionOS frosted glassmorphism and organic liquid fluid dynamics.
      </p>
    </div>

    <!-- Action Button -->
    <div class="flex flex-col items-center gap-3 w-full max-w-md">
      <button class="w-full py-4 rounded-2xl text-base font-bold text-slate-950 bg-gradient-to-r from-teal-300 via-white to-purple-200 hover:from-white hover:to-teal-200 shadow-[0_10px_40px_rgba(45,212,191,0.4)] transition-all duration-300 hover:scale-[1.02] flex items-center justify-center gap-2">
        <span>✨ ENTER SPATIAL EXPERIENCE</span>
      </button>
      <span class="text-xs font-medium text-slate-400">TAP TO BEGIN OR PRESS <kbd class="px-2 py-0.5 rounded-lg bg-white/[0.08] border border-white/[0.12] text-white font-mono">SPACE</kbd></span>
    </div>

  </div>
</body>
</html>
