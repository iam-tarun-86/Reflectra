<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Matrix 3D Wireframe Neural Avatar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'JetBrains Mono', monospace; }
    @keyframes avatar-spin { 0%, 100% { transform: rotateY(-20deg); } 50% { transform: rotateY(20deg); } }
    @keyframes wireframe-glow { 0%, 100% { filter: drop-shadow(0 0 10px #22c55e); } 50% { filter: drop-shadow(0 0 30px #4ade80); } }
    .avatar-sway { animation: avatar-spin 6s ease-in-out infinite; transform-style: preserve-3d; }
    .head-glow { animation: wireframe-glow 2.5s ease-in-out infinite; }
  </style>
</head>
<body class="bg-[#020803] text-emerald-400 min-h-screen flex items-center justify-center p-6 relative overflow-hidden selection:bg-emerald-500 selection:text-black">
  
  <!-- Cyber Grid & Green Glow -->
  <div class="absolute inset-0 opacity-15 pointer-events-none" style="background-image: linear-gradient(#22c55e 1px, transparent 1px), linear-gradient(90deg, #22c55e 1px, transparent 1px); background-size: 32px 32px;"></div>
  <div class="absolute w-[750px] h-[750px] rounded-full bg-emerald-500/15 blur-[170px] pointer-events-none"></div>

  <!-- Wireframe Avatar Container -->
  <div class="relative z-10 w-full max-w-2xl rounded-3xl bg-black/90 border-2 border-emerald-500/50 p-8 md:p-12 shadow-[0_0_100px_rgba(34,197,94,0.3)] flex flex-col items-center text-center gap-8 backdrop-blur-2xl">
    
    <!-- Top Avatar Status Bar -->
    <div class="flex items-center justify-between w-full border-b border-emerald-500/30 pb-4 text-xs">
      <div class="flex items-center gap-2 font-bold text-emerald-400">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
        <span class="tracking-widest uppercase">SYNTHETIC AVATAR // MESH RECONSTRUCTION</span>
      </div>
      <div class="text-emerald-500">
        VERTICES: <span class="text-white font-bold">468 PTS</span> • SAMPLING: <span class="text-emerald-300 font-bold">5.0 Hz</span>
      </div>
    </div>

    <!-- Center 3D Wireframe Head Hologram -->
    <div class="relative flex items-center justify-center w-64 h-64 my-1 avatar-sway">
      
      <!-- Coordinate Orbit Ring -->
      <svg class="absolute inset-0 w-full h-full animate-spin [animation-duration:18s] pointer-events-none opacity-40" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="92" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="12, 6" />
      </svg>

      <!-- 3D Polygonal Wireframe Head SVG -->
      <svg class="w-48 h-56 head-glow" viewBox="0 0 100 130">
        <!-- Skull Contours -->
        <polygon points="50,10 80,30 90,65 75,105 50,125 25,105 10,65 20,30" fill="rgba(34,197,94,0.08)" stroke="#22c55e" stroke-width="1.5" />
        <!-- Forehead & Eyebrows -->
        <line x1="20" y1="30" x2="80" y2="30" stroke="#22c55e" stroke-width="1" />
        <line x1="50" y1="10" x2="50" y2="45" stroke="#22c55e" stroke-width="1" />
        <polygon points="28,40 45,38 48,46 30,46" fill="none" stroke="#4ade80" stroke-width="1.2" />
        <polygon points="72,40 55,38 52,46 70,46" fill="none" stroke="#4ade80" stroke-width="1.2" />
        <!-- Eyes -->
        <circle cx="38" cy="50" r="4" fill="#22c55e" />
        <circle cx="62" cy="50" r="4" fill="#22c55e" />
        <!-- Nose Bridge Pyramid -->
        <polygon points="50,45 42,75 58,75" fill="rgba(34,197,94,0.15)" stroke="#4ade80" stroke-width="1.2" />
        <!-- Mouth Polygonal Plane -->
        <polygon points="32,95 50,90 68,95 50,105" fill="none" stroke="#4ade80" stroke-width="1.5" />
        <!-- Diagonal Tessellation Lines -->
        <line x1="10" y1="65" x2="42" y2="75" stroke="rgba(34,197,94,0.4)" stroke-width="0.8" />
        <line x1="90" y1="65" x2="58" y2="75" stroke="rgba(34,197,94,0.4)" stroke-width="0.8" />
        <line x1="25" y1="105" x2="32" y2="95" stroke="rgba(34,197,94,0.4)" stroke-width="0.8" />
        <line x1="75" y1="105" x2="68" y2="95" stroke="rgba(34,197,94,0.4)" stroke-width="0.8" />
      </svg>
    </div>

    <!-- Title & Description -->
    <div class="flex flex-col gap-2">
      <h1 class="text-3xl md:text-4xl font-black tracking-tight text-white drop-shadow-[0_0_20px_rgba(34,197,94,0.7)]">
        SYNTHETIC NEURAL AVATAR
      </h1>
      <p class="text-sm text-emerald-300 max-w-lg font-medium">
        Deep geometric tessellation reconstructing facial micro-expressions into real-time affective vectors.
      </p>
    </div>

    <!-- Action Button -->
    <div class="flex flex-col items-center gap-3 w-full max-w-md">
      <button class="w-full py-4 rounded-2xl text-base font-black text-black bg-emerald-400 hover:bg-emerald-300 shadow-[0_0_40px_rgba(34,197,94,0.8)] transition-all duration-300 hover:scale-[1.02] flex items-center justify-center gap-2">
        <span>⚡ INITIATE NEURAL UPLOAD</span>
      </button>
      <span class="text-xs text-emerald-500">PRESS <kbd class="px-1.5 py-0.5 rounded bg-emerald-950 border border-emerald-500/40 text-emerald-300">ENTER</kbd> TO SYNCHRONIZE AVATAR</span>
    </div>

  </div>
</body>
</html>
