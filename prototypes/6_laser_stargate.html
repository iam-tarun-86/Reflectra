<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Aceternity Hyper-Laser Stargate</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    @keyframes laser-pulse { 0%, 100% { filter: drop-shadow(0 0 15px #06b6d4) drop-shadow(0 0 35px #eab308); } 50% { filter: drop-shadow(0 0 30px #06b6d4) drop-shadow(0 0 60px #eab308); } }
    @keyframes rotate-gate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .stargate-spin { animation: rotate-gate 16s linear infinite; }
    .stargate-glow { animation: laser-pulse 2s ease-in-out infinite; }
  </style>
</head>
<body class="bg-[#050811] text-slate-100 min-h-screen flex items-center justify-center p-6 relative overflow-hidden selection:bg-amber-500 selection:text-black">
  
  <!-- Perspective Laser Grid Ground & Ceiling -->
  <div class="absolute inset-0 opacity-25 pointer-events-none" style="background: repeating-linear-gradient(90deg, #06b6d4 0px, transparent 1px, transparent 40px), repeating-linear-gradient(0deg, #eab308 0px, transparent 1px, transparent 40px); transform: perspective(500px) rotateX(60deg) translateY(120px);"></div>
  <div class="absolute w-[800px] h-[800px] rounded-full bg-cyan-500/15 blur-[180px] pointer-events-none"></div>

  <!-- Stargate Container -->
  <div class="relative z-10 w-full max-w-2xl rounded-3xl bg-slate-950/90 border border-cyan-500/40 p-8 md:p-12 shadow-[0_0_90px_rgba(6,182,212,0.3)] flex flex-col items-center text-center gap-8 backdrop-blur-2xl">
    
    <!-- Top System Header -->
    <div class="flex items-center justify-between w-full border-b border-cyan-500/20 pb-4 text-xs font-mono">
      <div class="flex items-center gap-2 text-cyan-400">
        <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping"></span>
        <span class="font-bold tracking-widest uppercase">ACETERNITY TACHYON STARGATE</span>
      </div>
      <div class="text-slate-400">
        BEAMS: <span class="text-amber-400 font-bold">4x CONVERGED</span> • FREQ: <span class="text-cyan-300 font-bold">532 nm</span>
      </div>
    </div>

    <!-- Center Laser Refraction Stargate -->
    <div class="relative flex items-center justify-center w-64 h-64 my-1">
      
      <!-- 4 Converging Corner Laser Beams -->
      <svg class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 200 200">
        <line x1="10" y1="10" x2="100" y2="100" stroke="#06b6d4" stroke-width="2" stroke-dasharray="8, 4" />
        <line x1="190" y1="10" x2="100" y2="100" stroke="#eab308" stroke-width="2" stroke-dasharray="8, 4" />
        <line x1="10" y1="190" x2="100" y2="100" stroke="#eab308" stroke-width="2" stroke-dasharray="8, 4" />
        <line x1="190" y1="190" x2="100" y2="100" stroke="#06b6d4" stroke-width="2" stroke-dasharray="8, 4" />
      </svg>

      <!-- Multi-Layered Rotating Tachyon Ring -->
      <svg class="absolute inset-2 w-60 h-60 stargate-spin pointer-events-none" viewBox="0 0 200 200">
        <polygon points="100,10 190,100 100,190 10,100" fill="none" stroke="#eab308" stroke-width="2" stroke-dasharray="16, 8" />
        <circle cx="100" cy="100" r="70" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4, 4" />
      </svg>

      <!-- Central Laser Core Prism -->
      <div class="relative w-28 h-28 rounded-full bg-gradient-to-tr from-cyan-500 via-amber-400 to-white shadow-[0_0_60px_#06b6d4] flex items-center justify-center stargate-glow">
        <div class="w-16 h-16 rounded-full bg-slate-950/90 border-2 border-amber-400 flex items-center justify-center">
          <span class="text-2xl">✨</span>
        </div>
      </div>
    </div>

    <!-- Title & Description -->
    <div class="flex flex-col gap-2">
      <h1 class="text-3xl md:text-4xl font-black tracking-tight bg-gradient-to-r from-white via-cyan-200 to-amber-300 bg-clip-text text-transparent">
        HYPER-LASER STARGATE PORTAL
      </h1>
      <p class="text-sm text-slate-300 max-w-lg font-medium">
        Precision optical frequency emitter focusing multi-dimensional affective vectors into a coherent neural reflection beam.
      </p>
    </div>

    <!-- Action Button -->
    <div class="flex flex-col items-center gap-3 w-full max-w-md">
      <button class="w-full py-4 rounded-2xl text-base font-black text-slate-950 bg-gradient-to-r from-cyan-400 via-amber-300 to-white hover:from-cyan-300 hover:to-amber-200 shadow-[0_0_40px_rgba(6,182,212,0.6)] transition-all duration-300 hover:scale-[1.02] flex items-center justify-center gap-2">
        <span>⚡ OPEN TACHYON STARGATE</span>
      </button>
      <span class="text-xs font-mono text-slate-400">PRESS <kbd class="px-1.5 py-0.5 rounded bg-slate-800 border border-cyan-500/30 text-cyan-300">ENTER</kbd> TO ENGAGE LASER MATRIX</span>
    </div>

  </div>
</body>
</html>
