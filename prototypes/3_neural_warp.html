<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Holographic Neural Warp Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    @keyframes orbit-1 { from { transform: rotate(0deg) translateX(75px) rotate(0deg); } to { transform: rotate(360deg) translateX(75px) rotate(-360deg); } }
    @keyframes orbit-2 { from { transform: rotate(120deg) translateX(75px) rotate(-120deg); } to { transform: rotate(480deg) translateX(75px) rotate(-480deg); } }
    @keyframes orbit-3 { from { transform: rotate(240deg) translateX(75px) rotate(-240deg); } to { transform: rotate(600deg) translateX(75px) rotate(-600deg); } }
    @keyframes warp-pulse { 0%, 100% { transform: scale(1); filter: drop-shadow(0 0 35px #a855f7); } 50% { transform: scale(1.1); filter: drop-shadow(0 0 55px #ec4899); } }
    .orb-orbit-1 { animation: orbit-1 8s linear infinite; }
    .orb-orbit-2 { animation: orbit-2 8s linear infinite; }
    .orb-orbit-3 { animation: orbit-3 8s linear infinite; }
    .singularity-pulse { animation: warp-pulse 3s ease-in-out infinite; }
  </style>
</head>
<body class="bg-[#080512] text-slate-100 min-h-screen flex items-center justify-center p-6 relative overflow-hidden selection:bg-purple-500 selection:text-white">
  
  <!-- Cosmic Galaxy Nebula Glow -->
  <div class="absolute w-[800px] h-[800px] rounded-full bg-purple-600/20 blur-[180px] pointer-events-none"></div>
  <div class="absolute w-[500px] h-[500px] rounded-full bg-pink-500/15 blur-[140px] pointer-events-none -top-20 -right-20"></div>

  <!-- visionOS Spatial Glass Container -->
  <div class="relative z-10 w-full max-w-2xl rounded-3xl bg-slate-900/80 border border-purple-500/35 p-8 md:p-12 shadow-[0_0_90px_rgba(168,85,247,0.3)] flex flex-col items-center text-center gap-8 backdrop-blur-3xl">
    
    <!-- Top System Badges -->
    <div class="flex items-center justify-between w-full border-b border-purple-500/20 pb-4 text-xs font-mono">
      <div class="flex items-center gap-2 text-purple-300">
        <span class="w-2.5 h-2.5 rounded-full bg-purple-400 animate-ping"></span>
        <span class="font-bold tracking-widest uppercase">SPATIAL NEURAL SINGULARITY</span>
      </div>
      <div class="text-slate-400">
        DIMENSIONS: <span class="text-purple-300 font-bold">7 AFFECTS</span> • WARP: <span class="text-pink-400 font-bold">READY</span>
      </div>
    </div>

    <!-- 3D Warp Singularity & Orbiting Emotion Crystals -->
    <div class="relative flex items-center justify-center w-64 h-64 my-1">
      <!-- Outer Starfield Orbit Rings -->
      <div class="absolute inset-0 rounded-full border border-dashed border-purple-400/30 animate-spin [animation-duration:30s]"></div>
      <div class="absolute inset-6 rounded-full border border-pink-400/40 animate-spin [animation-duration:20s] [animation-direction:reverse]"></div>

      <!-- Central Liquid AI Singularity Orb -->
      <div class="relative w-24 h-24 rounded-full bg-gradient-to-tr from-purple-600 via-pink-500 to-indigo-400 shadow-[0_0_60px_#a855f7] flex items-center justify-center singularity-pulse">
        <div class="w-14 h-14 rounded-full bg-gradient-to-br from-white/90 to-purple-200 shadow-[inset_0_0_15px_#c084fc] flex items-center justify-center">
          <span class="text-xl">✨</span>
        </div>
      </div>

      <!-- 3 Orbiting Emotion Satellites -->
      <div class="absolute w-7 h-7 rounded-full bg-emerald-400 shadow-[0_0_15px_#10b981] flex items-center justify-center text-xs font-bold text-slate-950 orb-orbit-1">
        😊
      </div>
      <div class="absolute w-7 h-7 rounded-full bg-sky-400 shadow-[0_0_15px_#38bdf8] flex items-center justify-center text-xs font-bold text-slate-950 orb-orbit-2">
        😢
      </div>
      <div class="absolute w-7 h-7 rounded-full bg-amber-400 shadow-[0_0_15px_#fbbf24] flex items-center justify-center text-xs font-bold text-slate-950 orb-orbit-3">
        😲
      </div>
    </div>

    <!-- Title & Description -->
    <div class="flex flex-col gap-2">
      <h1 class="text-3xl md:text-4xl font-black tracking-tight bg-gradient-to-r from-white via-purple-200 to-pink-300 bg-clip-text text-transparent">
        HOLOGRAPHIC NEURAL WARP
      </h1>
      <p class="text-sm text-slate-300 max-w-lg font-medium">
        Spatial consciousness portal harmonizing real-time biometric vision with Hume-grade organic affective fluid dynamics.
      </p>
    </div>

    <!-- Action Button -->
    <div class="flex flex-col items-center gap-3 w-full max-w-md">
      <button class="w-full py-4 rounded-2xl text-base font-black text-white bg-gradient-to-r from-purple-600 via-pink-600 to-indigo-600 hover:from-purple-500 hover:to-pink-500 shadow-[0_0_40px_rgba(168,85,247,0.6)] transition-all duration-300 hover:scale-[1.02] flex items-center justify-center gap-2">
        <span>🌌 AWAKEN NEURAL CONSCIOUSNESS</span>
      </button>
      <span class="text-xs font-mono text-slate-400">PRESS <kbd class="px-1.5 py-0.5 rounded bg-slate-800 border border-purple-500/30 text-purple-300">SPACE</kbd> TO INITIATE HYPERSPACE WARP</span>
    </div>

  </div>
</body>
</html>
