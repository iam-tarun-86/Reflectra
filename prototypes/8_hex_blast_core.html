<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cyberpunk Titanium Hexagon Core</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    @keyframes hex-rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes amber-flash { 0%, 100% { filter: drop-shadow(0 0 15px #f59e0b); } 50% { filter: drop-shadow(0 0 45px #f59e0b) drop-shadow(0 0 70px #ef4444); } }
    .hex-spin { animation: hex-rotate 24s linear infinite; }
    .amber-glow { animation: amber-flash 2s ease-in-out infinite; }
  </style>
</head>
<body class="bg-[#0b0804] text-slate-100 min-h-screen flex items-center justify-center p-6 relative overflow-hidden selection:bg-amber-500 selection:text-black">
  
  <!-- Industrial Hazard Ambient Glow -->
  <div class="absolute inset-0 opacity-15 pointer-events-none" style="background-image: repeating-linear-gradient(45deg, #f59e0b 0, #f59e0b 2px, transparent 0, transparent 32px);"></div>
  <div class="absolute w-[750px] h-[750px] rounded-full bg-amber-500/15 blur-[170px] pointer-events-none"></div>

  <!-- Industrial Blast Shield Container -->
  <div class="relative z-10 w-full max-w-2xl rounded-3xl bg-slate-950/90 border-2 border-amber-500/40 p-8 md:p-12 shadow-[0_0_90px_rgba(245,158,11,0.3)] flex flex-col items-center text-center gap-8 backdrop-blur-2xl">
    
    <!-- Top Hazard Header -->
    <div class="flex items-center justify-between w-full border-b border-amber-500/20 pb-4 text-xs font-mono">
      <div class="flex items-center gap-2 text-amber-400">
        <span class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-ping"></span>
        <span class="font-bold tracking-widest uppercase">TACTICAL HYDRAULIC CORE // TITAN-6</span>
      </div>
      <div class="text-slate-400">
        PRESSURE: <span class="text-amber-400 font-bold">4,500 PSI</span> • STATUS: <span class="text-emerald-400 font-bold">ARMED</span>
      </div>
    </div>

    <!-- Center Interlocking Hexagonal Blast Shield -->
    <div class="relative flex items-center justify-center w-64 h-64 my-1">
      
      <!-- Outer Rotating Hexagon Teeth -->
      <svg class="absolute inset-0 w-full h-full hex-spin pointer-events-none" viewBox="0 0 200 200">
        <polygon points="100,10 178,55 178,145 100,190 22,145 22,55" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="12, 6" />
        <circle cx="100" cy="100" r="82" fill="none" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5" stroke-dasharray="4, 4" />
      </svg>

      <!-- Center Solar Fusion Amber Core -->
      <div class="relative w-28 h-28 rounded-2xl bg-gradient-to-tr from-amber-600 via-orange-500 to-yellow-300 shadow-[0_0_60px_#f59e0b] flex items-center justify-center amber-glow rotate-45">
        <div class="w-16 h-16 rounded-xl bg-slate-950/90 border border-amber-400 flex items-center justify-center -rotate-45">
          <span class="font-mono text-xs font-black text-amber-300">ARMED</span>
        </div>
      </div>
    </div>

    <!-- Title & Description -->
    <div class="flex flex-col gap-2">
      <h1 class="text-3xl md:text-4xl font-black tracking-tight bg-gradient-to-r from-white via-amber-200 to-orange-400 bg-clip-text text-transparent">
        TITANIUM BLAST SHIELD CORE
      </h1>
      <p class="text-sm text-slate-300 max-w-lg font-medium">
        Heavy industrial cybernetic containment chamber with automated hydraulic decompression sequencing.
      </p>
    </div>

    <!-- Action Button -->
    <div class="flex flex-col items-center gap-3 w-full max-w-md">
      <button class="w-full py-4 rounded-2xl text-base font-black text-slate-950 bg-gradient-to-r from-amber-400 via-orange-400 to-yellow-300 hover:from-amber-300 hover:to-white shadow-[0_0_40px_rgba(245,158,11,0.6)] transition-all duration-300 hover:scale-[1.02] flex items-center justify-center gap-2">
        <span>⚠️ DISENGAGE BLAST SHIELD</span>
      </button>
      <span class="text-xs font-mono text-slate-400">PULL LEVER OR PRESS <kbd class="px-1.5 py-0.5 rounded bg-slate-800 border border-amber-500/30 text-amber-300">SPACE</kbd> TO VENT PRESSURE</span>
    </div>

  </div>
</body>
</html>
