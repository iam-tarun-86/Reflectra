<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arc Reactor Fusion Ignition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    @keyframes spin-cw { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spin-ccw { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
    @keyframes arc-pulse { 0%, 100% { opacity: 0.8; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); filter: drop-shadow(0 0 35px #00f0ff); } }
    .spin-slow { animation: spin-cw 20s linear infinite; }
    .spin-reverse-medium { animation: spin-ccw 12s linear infinite; }
    .spin-fast { animation: spin-cw 6s linear infinite; }
    .core-pulse { animation: arc-pulse 2s ease-in-out infinite; }
    .laser-arc { stroke-dasharray: 8, 4; animation: spin-cw 4s linear infinite; }
  </style>
</head>
<body class="bg-[#050914] text-slate-100 min-h-screen flex items-center justify-center p-6 relative overflow-hidden selection:bg-cyan-500 selection:text-black">
  
  <!-- Background Stark Tech Grid & Ambient Blue Glow -->
  <div class="absolute inset-0 opacity-20 pointer-events-none" style="background-image: radial-gradient(#00f0ff 1px, transparent 1px); background-size: 32px 32px;"></div>
  <div class="absolute w-[700px] h-[700px] rounded-full bg-cyan-500/15 blur-[160px] pointer-events-none"></div>

  <!-- Arc Reactor Container -->
  <div class="relative z-10 w-full max-w-2xl rounded-3xl bg-slate-950/85 border border-cyan-500/40 p-8 md:p-12 shadow-[0_0_80px_rgba(0,240,255,0.25)] flex flex-col items-center text-center gap-8 backdrop-blur-2xl">
    
    <!-- Top System Badges -->
    <div class="flex items-center justify-between w-full border-b border-cyan-500/20 pb-4 text-xs font-mono">
      <div class="flex items-center gap-2 text-cyan-400">
        <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping"></span>
        <span class="font-bold tracking-widest uppercase">STARK TENSOR CORE // MK-85</span>
      </div>
      <div class="text-slate-400">
        FLUX: <span class="text-cyan-300 font-bold">1.21 GW</span> • CONTAINMENT: <span class="text-emerald-400 font-bold">99.4%</span>
      </div>
    </div>

    <!-- Arc Reactor Mechanical Core -->
    <div class="relative flex items-center justify-center w-64 h-64 my-2">
      <!-- Outermost Solenoid Segment Ring -->
      <svg class="absolute inset-0 w-full h-full spin-slow pointer-events-none" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="94" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" stroke-dasharray="4, 4" />
        <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(0, 240, 255, 0.4)" stroke-width="3" stroke-dasharray="16, 8" />
      </svg>

      <!-- Counter-Rotating Middle Turbine Ring -->
      <svg class="absolute inset-4 w-56 h-56 spin-reverse-medium pointer-events-none" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="82" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2" stroke-dasharray="32, 12" />
        <!-- 10 Radially Positioned Magnetic Coils -->
        <g stroke="#00f0ff" stroke-width="3">
          <line x1="100" y1="18" x2="100" y2="30" />
          <line x1="100" y1="170" x2="100" y2="182" />
          <line x1="18" y1="100" x2="30" y2="100" />
          <line x1="170" y1="100" x2="182" y2="100" />
          <line x1="42" y1="42" x2="50" y2="50" />
          <line x1="158" y1="158" x2="150" y2="150" />
          <line x1="158" y1="42" x2="150" y2="50" />
          <line x1="42" y1="158" x2="50" y2="150" />
        </g>
      </svg>

      <!-- Fast Inner Containment Ring -->
      <svg class="absolute inset-10 w-44 h-44 spin-fast pointer-events-none" viewBox="0 0 200 200">
        <polygon points="100,20 180,160 20,160" fill="none" stroke="rgba(0, 240, 255, 0.6)" stroke-width="2" stroke-dasharray="8, 4" />
      </svg>

      <!-- Center Blinding Plasma Singularity Core -->
      <div class="relative w-24 h-24 rounded-full bg-gradient-to-tr from-cyan-600 via-cyan-400 to-white shadow-[0_0_60px_#00f0ff] flex items-center justify-center core-pulse">
        <div class="w-16 h-16 rounded-full bg-white shadow-[inset_0_0_20px_#00f0ff] flex items-center justify-center">
          <span class="font-mono text-xs font-black text-cyan-950 tracking-tighter">98.4%</span>
        </div>
      </div>
    </div>

    <!-- Title & Description -->
    <div class="flex flex-col gap-2">
      <h1 class="text-3xl md:text-4xl font-black tracking-tight bg-gradient-to-r from-white via-cyan-200 to-cyan-400 bg-clip-text text-transparent">
        ARC REACTOR FUSION CORE
      </h1>
      <p class="text-sm text-slate-300 max-w-lg font-medium">
        High-energy electromagnetic induction system powering EmotionLens multi-agent neural tensor pipelines.
      </p>
    </div>

    <!-- Action Button -->
    <div class="flex flex-col items-center gap-3 w-full max-w-md">
      <button class="w-full py-4 rounded-2xl text-base font-black text-slate-950 bg-gradient-to-r from-cyan-400 via-cyan-300 to-white hover:from-cyan-300 hover:to-white shadow-[0_0_40px_rgba(0,240,255,0.6)] transition-all duration-300 hover:scale-[1.02] flex items-center justify-center gap-2">
        <span>⚡ IGNITE FUSION POWER</span>
      </button>
      <span class="text-xs font-mono text-slate-400">HOLD <kbd class="px-1.5 py-0.5 rounded bg-slate-800 border border-cyan-500/30 text-cyan-300">SPACE</kbd> TO INITIATE FULL DISCHARGE</span>
    </div>

  </div>
</body>
</html>
