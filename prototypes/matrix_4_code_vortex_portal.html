<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Matrix Code Vortex Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'JetBrains Mono', monospace; }
    @keyframes vortex-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes vortex-pulse { 0%, 100% { transform: scale(1); filter: drop-shadow(0 0 25px #22c55e) drop-shadow(0 0 45px #eab308); } 50% { transform: scale(1.1); filter: drop-shadow(0 0 50px #22c55e) drop-shadow(0 0 80px #eab308); } }
    .vortex-rotate { animation: vortex-spin 20s linear infinite; }
    .portal-pulse { animation: vortex-pulse 2.5s ease-in-out infinite; }
  </style>
</head>
<body class="bg-[#020603] text-emerald-400 min-h-screen flex items-center justify-center p-6 relative overflow-hidden selection:bg-amber-400 selection:text-black">
  
  <!-- Radial Amber & Emerald Ambient Glow -->
  <div class="absolute w-[800px] h-[800px] rounded-full bg-emerald-500/15 blur-[180px] pointer-events-none"></div>
  <div class="absolute w-[500px] h-[500px] rounded-full bg-amber-500/10 blur-[150px] pointer-events-none -top-20 -right-20"></div>

  <!-- Portal Container -->
  <div class="relative z-10 w-full max-w-2xl rounded-3xl bg-black/90 border-2 border-emerald-500/40 p-8 md:p-12 shadow-[0_0_90px_rgba(34,197,94,0.3)] flex flex-col items-center text-center gap-8 backdrop-blur-2xl">
    
    <!-- Top Telemetry Header -->
    <div class="flex items-center justify-between w-full border-b border-emerald-500/30 pb-4 text-xs">
      <div class="flex items-center gap-2 font-bold text-emerald-400">
        <span class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-ping"></span>
        <span class="tracking-widest uppercase">QUANTUM CODE VORTEX // MODAL PORTAL</span>
      </div>
      <div class="text-amber-400 font-bold">
        GLYPH STREAM: <span class="text-white">100K/s</span>
      </div>
    </div>

    <!-- Center Radial Code Vortex Singularity -->
    <div class="relative flex items-center justify-center w-64 h-64 my-1">
      
      <!-- Outer Radial Code Spiral SVG -->
      <svg class="absolute inset-0 w-full h-full vortex-rotate pointer-events-none" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="92" fill="none" stroke="#eab308" stroke-width="1.5" stroke-dasharray="16, 8" />
        <circle cx="100" cy="100" r="80" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="6, 6" />
        <!-- Radial Spoke Glyphs -->
        <g stroke="#22c55e" stroke-width="1" opacity="0.6">
          <line x1="100" y1="8" x2="100" y2="40" />
          <line x1="100" y1="160" x2="100" y2="192" />
          <line x1="8" y1="100" x2="40" y2="100" />
          <line x1="160" y1="100" x2="192" y2="100" />
        </g>
      </svg>

      <!-- Center Blinding Quantum Singularity -->
      <div class="relative w-28 h-28 rounded-full bg-gradient-to-tr from-emerald-600 via-amber-400 to-white shadow-[0_0_60px_#22c55e] flex items-center justify-center portal-pulse">
        <div class="w-16 h-16 rounded-full bg-black border-2 border-amber-400 flex items-center justify-center shadow-inner">
          <span class="text-2xl text-white">🌀</span>
        </div>
      </div>
    </div>

    <!-- Title & Description -->
    <div class="flex flex-col gap-2">
      <h1 class="text-3xl md:text-4xl font-black tracking-tight text-white drop-shadow-[0_0_20px_rgba(234,179,8,0.7)]">
        MODAL MATRIX SINGULARITY
      </h1>
      <p class="text-sm text-emerald-300 max-w-lg font-medium">
        Bending raw digital code streams into an empathic cognitive feedback loop between human affect and machine consciousness.
      </p>
    </div>

    <!-- Action Button -->
    <div class="flex flex-col items-center gap-3 w-full max-w-md">
      <button class="w-full py-4 rounded-2xl text-base font-black text-black bg-gradient-to-r from-emerald-400 via-amber-300 to-emerald-400 hover:from-amber-300 hover:to-white shadow-[0_0_40px_rgba(34,197,94,0.8)] transition-all duration-300 hover:scale-[1.02] flex items-center justify-center gap-2">
        <span>⚡ OPEN MODAL CODE PORTAL</span>
      </button>
      <span class="text-xs text-emerald-500">PRESS <kbd class="px-1.5 py-0.5 rounded bg-emerald-950 border border-emerald-500/40 text-emerald-300">SPACE</kbd> TO INITIATE VORTEX</span>
    </div>

  </div>
</body>
</html>
