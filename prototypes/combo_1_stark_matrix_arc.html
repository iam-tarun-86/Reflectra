<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stark-Matrix Quantum Arc Core</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    @keyframes spin-cw { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spin-ccw { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
    @keyframes core-flare { 0%, 100% { filter: drop-shadow(0 0 25px #10b981) drop-shadow(0 0 45px #00ff9d); transform: scale(1); } 50% { filter: drop-shadow(0 0 45px #10b981) drop-shadow(0 0 80px #38bdf8); transform: scale(1.08); } }
    .spin-slow { animation: spin-cw 22s linear infinite; }
    .spin-reverse { animation: spin-ccw 14s linear infinite; }
    .arc-glow { animation: core-flare 2.5s ease-in-out infinite; }
  </style>
</head>
<body class="bg-[#020905] text-slate-100 min-h-screen flex items-center justify-center p-6 relative overflow-hidden selection:bg-emerald-400 selection:text-black">
  
  <!-- Canvas Matrix Digital Rain Background -->
  <canvas id="matrixRain" class="absolute inset-0 w-full h-full opacity-25 pointer-events-none"></canvas>
  <div class="absolute w-[800px] h-[800px] rounded-full bg-emerald-500/15 blur-[190px] pointer-events-none"></div>

  <!-- Master Stark-Matrix Card Container -->
  <div class="relative z-10 w-full max-w-2xl rounded-3xl bg-slate-950/90 border border-emerald-500/40 p-8 md:p-12 shadow-[0_0_100px_rgba(16,185,129,0.3)] flex flex-col items-center text-center gap-8 backdrop-blur-2xl">
    
    <!-- Top Stark-Matrix Telemetry Bar -->
    <div class="flex items-center justify-between w-full border-b border-emerald-500/20 pb-4 text-xs font-mono">
      <div class="flex items-center gap-2 text-emerald-400 font-bold">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
        <span class="tracking-widest uppercase">STARK-MATRIX // TENSOR FUSION MK-85</span>
      </div>
      <div class="text-slate-400">
        FLUX: <span class="text-emerald-300 font-bold">1.21 GW</span> • CODEC: <span class="text-teal-300 font-bold">DEEPFACE_5Hz</span>
      </div>
    </div>

    <!-- Stark Arc Reactor Turbine + Matrix Green Fusion Core -->
    <div class="relative flex items-center justify-center w-64 h-64 my-1">
      
      <!-- Outermost Solenoid Segment Ring -->
      <svg class="absolute inset-0 w-full h-full spin-slow pointer-events-none" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="94" fill="none" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5" stroke-dasharray="6, 6" />
        <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(0, 255, 157, 0.5)" stroke-width="3" stroke-dasharray="18, 10" />
      </svg>

      <!-- Counter-Rotating Middle Turbine Solenoids -->
      <svg class="absolute inset-4 w-56 h-56 spin-reverse pointer-events-none" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="82" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2" stroke-dasharray="32, 12" />
        <!-- 8 Radially Symmetrical Matrix Coils -->
        <g stroke="#00ff9d" stroke-width="3">
          <line x1="100" y1="18" x2="100" y2="30" />
          <line x1="100" y1="170" x2="100" y2="182" />
          <line x1="18" y1="100" x2="30" y2="100" />
          <line x1="170" y1="100" x2="182" y2="100" />
          <line x1="42" y1="42" x2="50" y2="50" />
          <line x1="158" y1="158" x2="150" y2="150" />
          <line x1="158" y1="42" x2="150" y2="50" />
          <line x1="42" y1="158" x2="50" y2="150" />
        </g>
      </svg>

      <!-- Center Emerald-Teal Plasma Singularity Core -->
      <div class="relative w-28 h-28 rounded-full bg-gradient-to-tr from-emerald-600 via-teal-400 to-white shadow-[0_0_60px_#10b981] flex items-center justify-center arc-glow">
        <div class="w-16 h-16 rounded-full bg-slate-950/90 border border-emerald-400 flex flex-col items-center justify-center gap-0.5 shadow-inner">
          <span class="font-mono text-xs font-black text-emerald-300">99.8%</span>
          <span class="font-mono text-[9px] font-bold text-teal-400">SYNCED</span>
        </div>
      </div>
    </div>

    <!-- Title & Description -->
    <div class="flex flex-col gap-2">
      <h1 class="text-3xl md:text-4xl font-black tracking-tight bg-gradient-to-r from-white via-emerald-200 to-teal-300 bg-clip-text text-transparent">
        QUANTUM ARC CONSTRUCT
      </h1>
      <p class="text-sm text-slate-300 max-w-lg font-medium">
        Stark-engineered fusion rings channeling the Matrix neural tensor bus to power real-time emotional computing.
      </p>
    </div>

    <!-- Action Button -->
    <div class="flex flex-col items-center gap-3 w-full max-w-md">
      <button class="w-full py-4 rounded-2xl text-base font-black text-slate-950 bg-gradient-to-r from-emerald-400 via-teal-300 to-white hover:from-emerald-300 hover:to-white shadow-[0_0_40px_rgba(16,185,129,0.7)] transition-all duration-300 hover:scale-[1.02] flex items-center justify-center gap-2">
        <span>⚡ IGNITE QUANTUM CONSTRUCT</span>
      </button>
      <span class="text-xs font-mono text-slate-400">HOLD <kbd class="px-1.5 py-0.5 rounded bg-slate-800 border border-emerald-500/30 text-emerald-300">SPACE</kbd> TO INITIATE FUSION DISCHARGE</span>
    </div>

  </div>

  <!-- Real-Time Matrix Rain Script -->
  <script>
    const c = document.getElementById("matrixRain");
    const ctx = c.getContext("2d");
    c.width = window.innerWidth;
    c.height = window.innerHeight;
    const chars = "0123456789ABCDEFｦｱｳｴｵｶｷｹｺｻｼｽｾｿﾀﾂﾃﾅﾆﾇﾈ";
    const fontSize = 14;
    const cols = Math.floor(c.width / fontSize);
    const drops = Array(cols).fill(1);

    function renderRain() {
      ctx.fillStyle = "rgba(2, 9, 5, 0.09)";
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.fillStyle = "#10b981";
      ctx.font = fontSize + "px 'JetBrains Mono', monospace";
      for (let i = 0; i < drops.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > c.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(renderRain, 35);
  </script>
</body>
</html>
