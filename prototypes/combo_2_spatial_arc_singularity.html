<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spatial Neural Arc Singularity</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    @keyframes spin-cw { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spin-ccw { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
    @keyframes orbit-1 { from { transform: rotate(0deg) translateX(85px) rotate(0deg); } to { transform: rotate(360deg) translateX(85px) rotate(-360deg); } }
    @keyframes orbit-2 { from { transform: rotate(120deg) translateX(85px) rotate(-120deg); } to { transform: rotate(480deg) translateX(85px) rotate(-480deg); } }
    @keyframes orbit-3 { from { transform: rotate(240deg) translateX(85px) rotate(-240deg); } to { transform: rotate(600deg) translateX(85px) rotate(-600deg); } }
    @keyframes singularity-glow { 0%, 100% { filter: drop-shadow(0 0 25px #00f0ff) drop-shadow(0 0 45px #a855f7); transform: scale(1); } 50% { filter: drop-shadow(0 0 50px #00f0ff) drop-shadow(0 0 85px #ec4899); transform: scale(1.08); } }
    .spin-slow { animation: spin-cw 20s linear infinite; }
    .spin-reverse { animation: spin-ccw 12s linear infinite; }
    .orb-orbit-1 { animation: orbit-1 9s linear infinite; }
    .orb-orbit-2 { animation: orbit-2 9s linear infinite; }
    .orb-orbit-3 { animation: orbit-3 9s linear infinite; }
    .core-pulse { animation: singularity-glow 2.5s ease-in-out infinite; }
  </style>
</head>
<body class="bg-[#060814] text-slate-100 min-h-screen flex items-center justify-center p-6 relative overflow-hidden selection:bg-purple-500 selection:text-white">
  
  <!-- Cosmic Ambient Lighting -->
  <div class="absolute w-[800px] h-[800px] rounded-full bg-cyan-600/15 blur-[180px] pointer-events-none -top-20 -left-20"></div>
  <div class="absolute w-[600px] h-[600px] rounded-full bg-purple-600/20 blur-[160px] pointer-events-none -bottom-20 -right-20"></div>

  <!-- Master Card Container -->
  <div class="relative z-10 w-full max-w-2xl rounded-3xl bg-slate-900/80 border border-purple-500/35 p-8 md:p-12 shadow-[0_0_100px_rgba(168,85,247,0.3)] flex flex-col items-center text-center gap-8 backdrop-blur-3xl">
    
    <!-- Top Status Bar -->
    <div class="flex items-center justify-between w-full border-b border-purple-500/20 pb-4 text-xs font-mono">
      <div class="flex items-center gap-2 text-cyan-300 font-bold">
        <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping"></span>
        <span class="tracking-widest uppercase">SPATIAL NEURAL ARC // V4.2</span>
      </div>
      <div class="text-slate-400">
        SINGULARITY: <span class="text-purple-300 font-bold">STABLE</span> • WARP: <span class="text-cyan-300 font-bold">ARMED</span>
      </div>
    </div>

    <!-- Arc Reactor Solenoid Rings + Fluid Singularity Core + 3 Emotion Satellites -->
    <div class="relative flex items-center justify-center w-64 h-64 my-1">
      
      <!-- Outermost Arc Solenoid Ring -->
      <svg class="absolute inset-0 w-full h-full spin-slow pointer-events-none" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="92" fill="none" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1.5" stroke-dasharray="4, 4" />
        <circle cx="100" cy="100" r="86" fill="none" stroke="rgba(168, 85, 247, 0.5)" stroke-width="2.5" stroke-dasharray="16, 8" />
      </svg>

      <!-- Counter-Rotating Middle Ring -->
      <svg class="absolute inset-4 w-56 h-56 spin-reverse pointer-events-none" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="80" fill="none" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5" stroke-dasharray="24, 12" />
        <!-- 6 Precision Solenoids -->
        <g stroke="#00f0ff" stroke-width="2.5">
          <line x1="100" y1="20" x2="100" y2="30" />
          <line x1="100" y1="170" x2="100" y2="180" />
          <line x1="30" y1="60" x2="40" y2="66" />
          <line x1="170" y1="140" x2="160" y2="134" />
          <line x1="170" y1="60" x2="160" y2="66" />
          <line x1="30" y1="140" x2="40" y2="134" />
        </g>
      </svg>

      <!-- Center Fluid Consciousness Singularity Core -->
      <div class="relative w-28 h-28 rounded-full bg-gradient-to-tr from-cyan-500 via-purple-500 to-pink-400 shadow-[0_0_60px_#00f0ff] flex items-center justify-center core-pulse">
        <div class="w-16 h-16 rounded-full bg-slate-950/90 border border-white/40 flex items-center justify-center">
          <span class="text-2xl">✨</span>
        </div>
      </div>

      <!-- 3 Orbiting Emotion Satellites -->
      <div class="absolute w-7 h-7 rounded-full bg-emerald-400 shadow-[0_0_15px_#10b981] flex items-center justify-center text-xs font-bold text-slate-950 orb-orbit-1">
        😊
      </div>
      <div class="absolute w-7 h-7 rounded-full bg-sky-400 shadow-[0_0_15px_#38bdf8] flex items-center justify-center text-xs font-bold text-slate-950 orb-orbit-2">
        😢
      </div>
      <div class="absolute w-7 h-7 rounded-full bg-amber-400 shadow-[0_0_15px_#fbbf24] flex items-center justify-center text-xs font-bold text-slate-950 orb-orbit-3">
        😲
      </div>

    </div>

    <!-- Title & Description -->
    <div class="flex flex-col gap-2">
      <h1 class="text-3xl md:text-4xl font-black tracking-tight bg-gradient-to-r from-white via-cyan-200 to-purple-300 bg-clip-text text-transparent">
        SPATIAL NEURAL ARC SINGULARITY
      </h1>
      <p class="text-sm text-slate-300 max-w-lg font-medium">
        Harmonizing Stark-grade precision electromagnetic containment with visionOS spatial affective intelligence.
      </p>
    </div>

    <!-- Action Button -->
    <div class="flex flex-col items-center gap-3 w-full max-w-md">
      <button class="w-full py-4 rounded-2xl text-base font-black text-white bg-gradient-to-r from-cyan-500 via-purple-600 to-pink-500 hover:from-cyan-400 hover:to-pink-400 shadow-[0_0_40px_rgba(0,240,255,0.6)] transition-all duration-300 hover:scale-[1.02] flex items-center justify-center gap-2">
        <span>🌌 ENGAGE EMOTIONAL SINGULARITY</span>
      </button>
      <span class="text-xs font-mono text-slate-400">PRESS <kbd class="px-1.5 py-0.5 rounded bg-slate-800 border border-purple-500/30 text-purple-300">SPACE</kbd> TO IGNITE NEURAL CORE</span>
    </div>

  </div>
</body>
</html>
